# Monthly is right for a small static site: enough to stay current, not enough
# to generate noise. Compatible updates arrive as one grouped pull request;
# majors arrive on their own and are reviewed by hand. Nothing auto-merges.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      tooling:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
