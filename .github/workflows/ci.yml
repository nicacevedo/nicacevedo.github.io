name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, format, build and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types and content schemas
        run: npm run check

      # `prebuild` regenerates the favicons and the social cards, so this step
      # also proves the generators run in a clean checkout.
      - name: Production build
        run: npm run build

      # The generators are deterministic, so a clean tree here is the proof that
      # the committed icons and cards match the content they are built from.
      - name: Committed icons and social cards are up to date
        run: |
          if ! git diff --quiet -- public; then
            echo "::error::Generated assets are stale. Run 'npm run icons && npm run og' and commit the result."
            git --no-pager diff --stat -- public
            exit 1
          fi
          echo "generated assets match the content they are built from"

      - name: Architecture and weight budgets
        run: npm run budget

  test:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Build the site the tests run against
        run: npm run build

      # Chromium carries the full regression suite; Firefox and WebKit are here
      # only for the cross-engine smoke spec.
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the suite
        run: npm test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
